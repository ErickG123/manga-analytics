<a class="manga-card" [routerLink]="['/catalogo', manga().slug]">
  <div class="cover" [style.--cover-accent]="manga().accent">
    <button
      type="button"
      class="favorite-badge-btn"
      [class.active]="isFavorite()"
      (click)="toggleFavorite($event)"
      [attr.aria-label]="isFavorite() ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
      [title]="isFavorite() ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
    >
      {{ isFavorite() ? '★' : '☆' }}
    </button>
    @if (manga().coverUrl) {
      <img [src]="manga().coverUrl" [alt]="manga().title" class="cover-image" />
    } @else {
      <span class="cover-top">MANGÁ ATLAS</span>
      <span class="cover-monogram">{{ manga().initials }}</span>
      <span class="cover-bottom">{{ manga().category }}</span>
    }
  </div>
  <div class="card-body">
    <span class="eyebrow">{{ manga().publisher }}</span>
    <h3>{{ manga().title }}</h3>
    <div class="card-bottom">
      <span>{{ manga().volumes.length }} volumes</span>
      <span class="arrow">↗</span>
    </div>
  </div>
</a>
