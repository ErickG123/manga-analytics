services:
  postgres:
    image: postgres:17-alpine
    container_name: manga_atlas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manga_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-manga_atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manga_atlas_secret}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: manga_atlas_postgres_data
